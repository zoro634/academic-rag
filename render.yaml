services:
  - type: web
    name: academic-rag-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./chroma_db
      - key: UPLOAD_DIRECTORY
        value: ./uploads
